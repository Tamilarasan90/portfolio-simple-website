<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styler.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Young+Serif&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="container">
        <div class="section-one">

            <h1 class="section-one__title">Tamilarasan Nagarajan</h1>
            <p class="section-one__descr">Web Developer, Swing Trader in F&O, Position Trading, Forex Trader, Crypto
                Trader, Option Buying</p>
            <a class="section-one__contact" href="index.html">Home</a>

        </div>

        <div class="contact-form">

            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td>
                            <input type="text" placeholder="Your name" class ="contact-form__input">
                        </td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td>
                            <input type="email" placeholder="Your email" class ="contact-form__input">
                        </td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td>
                            <textarea placeholder="Your message" class="contact-form__textarea"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="Submit" class="contact-form__submit">
                        </td>
                    </tr>
                    <p>

                    </p>
                </table>
            </form>

        </div>


        <div class="section-five">

            <p class="section-five__title">Social Media:
                <a href="https://www.linkedin.com/feed/" target="_blank">LinkedIn</a>,
                <a href="https://www.instagram.com/?hl=en" target="_blank">Instagram</a>
            </p>

            <p class="section-five__descr">&copy; 2023 Tamilarasan Nagarajan. All rights reserved.</p>


        </div>
    </div>

</body>

</html>
